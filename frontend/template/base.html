<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
    <title>{% block title %}RemoteLink{% endblock %}</title>

    <link
        rel="stylesheet"
        href="/static/css/base.css"
    >

    {% block head %}{% endblock %}
</head>

<body>

{% block header %}
<header class="header">

    <div class="header-container">

        <a href="/domain" class="logo">
            <img src="/static/icons/favicon.ico" alt="RemoteLink Icon" class="logo-icon">
            RemoteLink
        </a>

        <div class="header-actions">
            {% include "macros/history.html" %}

            <button
                type="button"
                class="circle-btn circle-btn--menu"
                id="menu-toggle"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="site-drawer"
            >
                <span class="circle-btn-bg"></span>
                <span class="circle-btn-icon" aria-hidden="true"><span></span><span></span></span>
            </button>
        </div>

    </div>

</header>

<div class="drawer-overlay" id="drawer-overlay"></div>

<aside class="drawer" id="site-drawer" aria-label="Site navigation">

    <div class="drawer-head">
        <span class="drawer-title">
            <span class="drawer-dot" aria-hidden="true"></span>
            Menu
        </span>

        <button
            type="button"
            class="circle-btn circle-btn--close"
            id="drawer-close"
            aria-label="Close menu"
        >
            <span class="circle-btn-bg"></span>
            <span class="circle-btn-icon" aria-hidden="true"><span></span><span></span></span>
        </button>
    </div>

    <div class="drawer-body">
        <ul class="nav" style="margin:0;padding:0">
            <li class="nav-item" style="--i:0">
                <a class="nav-link" href="/domain_schema"><span class="nav-link-text">Domain</span></a>
            </li>
            <li class="nav-item" style="--i:1">
                <a class="nav-link" href="/switches"><span class="nav-link-text">Switches</span></a>
            </li>
            <li class="nav-item" style="--i:2">
                <a class="nav-link" href="/switch_inventory"><span class="nav-link-text">Inventory</span></a>
            </li>
            <li class="nav-item" style="--i:3">
                <a class="nav-link" href="/credentials"><span class="nav-link-text">Credentials</span></a>
            </li>
        </ul>
    </div>

</aside>
{% endblock %}


<main class="main">

    {% block content %}
    {% endblock %}

</main>


<script type="module" src="/static/js/shared/history/widget.js"></script>
<script src="/static/js/shared/auth/redirect.js"></script>
<script src="/static/js/common/nav.js"></script>
{% block scripts %}
{% endblock %}

</body>
</html>
