<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
    <title>{% block title %}RemoteLink{% endblock %}</title>

    <link
        rel="stylesheet"
        href="/static/css/base.css"
    >

    {% block head %}{% endblock %}
</head>

<body>

<header class="header">

    <div class="header-container">

        <a href="/" class="logo">
            <img src="/static/icons/favicon.ico" alt="RemoteLink Icon" class="logo-icon">
            RemoteLink
        </a>

        <nav class="nav">
            {% include "components/history.html" %}

            <a href="/connect">
                Connect
            </a>

            <a href="/credentials">
                Credentials
            </a>

        </nav>

    </div>

</header>


<main class="main">

    {% block content %}
    {% endblock %}

</main>


<script type="module" src="/static/js/terminal-history-widget.js"></script>

{% block scripts %}
{% endblock %}

</body>
</html>
