<link
    rel="stylesheet"
    href="/static/css/history.css"
>

<div class="terminal-history">
    <span
        class="terminal-history-title"
        id="terminal-history-title"
    >
        History
    </span>

    <div
        class="terminal-history-menu"
        id="terminal-history-body"
    ></div>
</div>

<script>
    function renderTerminalHistory() {
        const history =
            JSON.parse(localStorage.getItem("terminal_history") || "[]");

        const historyBody =
            document.getElementById("terminal-history-body");

        if (!historyBody) {
            return;
        }

        historyBody.innerHTML = "";

        history.forEach((entry) => {
            const row =
                document.createElement("div");

            row.className =
                "terminal-history-row";

            const iconCell =
                document.createElement("span");

            iconCell.className =
                "terminal-history-icon";

            const contentCell =
                document.createElement("span");

            contentCell.className =
                "terminal-history-content";

            const link =
                document.createElement("a");

            if (entry.type === "ssh") {
                const icon =
                    document.createElement("img");

                icon.src =
                    "/static/icons/ssh.ico";

                icon.alt = "SSH";

                iconCell.appendChild(icon);

                link.href =
                    `/terminal?host=${encodeURIComponent(entry.host)}`;

                link.target = "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    entry.host;

            } else if (entry.type === "script") {
                const pathParts =
                    entry.path
                        .split(/[\\/]/)
                        .filter(Boolean);

                if (pathParts.length < 2) {
                    return;
                }

                const directory =
                    pathParts[pathParts.length - 2];

                const filename =
                    pathParts[pathParts.length - 1]
                        .replace(/\.[^/.]+$/, "");

                const displayName =
                    entry.name
                        ? `${directory}\\${filename} ${entry.name}`
                        : `${directory}\\${filename}`;

                // "|" is invalid in Windows path segments, so it's a safe,
                // reversible delimiter for packing path+arg into the single
                // opaque `script` value that /terminal forwards straight
                // through to /ws/script?name=...
                const scriptRef =
                    `${directory}\\${filename}|${entry.name}`;

                const icon =
                    document.createElement("img");

                icon.src =
                    "/static/icons/script.ico";

                icon.alt = "Script";

                iconCell.appendChild(icon);

                link.href =
                    `/terminal?script=${encodeURIComponent(scriptRef)}`;

                link.target = "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    displayName;

            } else {
                return;
            }

            contentCell.appendChild(link);

            row.appendChild(iconCell);
            row.appendChild(contentCell);

            historyBody.appendChild(row);
        });
    }

    renderTerminalHistory();

    document
        .getElementById("terminal-history-title")
        ?.addEventListener("click", () => {

            document
                .querySelector(".terminal-history")
                ?.classList.toggle("terminal-history-open");

        });

    document.addEventListener("click", (event) => {
        if (!event.target.closest(".terminal-history")) {
            document
                .querySelector(".terminal-history")
                ?.classList.remove("terminal-history-open");
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            document
                .querySelector(".terminal-history")
                ?.classList.remove("terminal-history-open");
        }
    });
</script>
