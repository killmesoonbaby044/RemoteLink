<link
    rel="stylesheet"
    href="/static/components/history.css"
>

<div class="terminal-history">
    <table class="terminal-history-table">
        <tbody id="terminal-history-body"></tbody>
    </table>
</div>

<script>
    function renderTerminalHistory() {
        const history =
            JSON.parse(localStorage.getItem("terminal_history") || "[]");

        const tableBody =
            document.getElementById("terminal-history-body");

        if (!tableBody) {
            return;
        }

        tableBody.innerHTML = "";

        history.forEach((entry) => {
            const row = document.createElement("tr");

            const iconCell = document.createElement("td");
            const contentCell = document.createElement("td");

            const link = document.createElement("a");

            if (entry.type === "ssh") {
                const icon = document.createElement("img");

                icon.src = "/static/components/ssh.ico";
                icon.alt = "SSH";

                iconCell.appendChild(icon);

                link.href =
                    `/terminal?host=${encodeURIComponent(entry.host)}`;

                link.target = "_blank";
                link.rel = "noopener noreferrer";

                link.textContent = entry.host;

            } else if (entry.type === "script") {
                const pathParts =
                    entry.path
                        .split(/[\\/]/)
                        .filter(Boolean);

                if (pathParts.length < 2) {
                    return;
                }

                const directory =
                    pathParts[pathParts.length - 2];

                const filename =
                    pathParts[pathParts.length - 1]
                        .replace(/\.[^/.]+$/, "");

                const displayName =
                    `${directory}\\${filename} ${entry.name}`;

                const icon = document.createElement("img");

                icon.src = "/static/components/script.ico";
                icon.alt = "Script";

                iconCell.appendChild(icon);

                link.href =
                `/terminal?script=${encodeURIComponent(displayName)}`;

                link.target = "_blank";
                link.rel = "noopener noreferrer";

                link.textContent = displayName;

            } else {
                return;
            }

            contentCell.appendChild(link);

            row.appendChild(iconCell);
            row.appendChild(contentCell);

            tableBody.appendChild(row);
        });
    }

    renderTerminalHistory();
</script>
